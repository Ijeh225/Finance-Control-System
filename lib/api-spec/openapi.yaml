openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FinCommand Executive Treasury API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: bills
    description: Bills and payment management
  - name: vendors
    description: Vendor/beneficiary management
  - name: wallets
    description: Wallet/account management
  - name: notifications
    description: Notification management
  - name: comments
    description: Comment and activity management
  - name: dashboard
    description: Dashboard summary endpoints
  - name: reports
    description: Reports and exports
  - name: audit
    description: Audit trail

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── DASHBOARD ───────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: MD dashboard summary cards
      parameters:
        - name: userId
          in: query
          schema:
            type: string
          description: Filter by user ID (omit for all users)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/scheduled-today:
    get:
      operationId: getScheduledToday
      tags: [dashboard]
      summary: All payments scheduled for today
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [user, vendor, priority, dueDate]
      responses:
        "200":
          description: Today scheduled payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                required: [bills, total]

  /dashboard/scheduled-tomorrow:
    get:
      operationId: getScheduledTomorrow
      tags: [dashboard]
      summary: All payments scheduled for tomorrow
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tomorrow scheduled payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                required: [bills, total]

  /dashboard/overdue:
    get:
      operationId: getOverdueBills
      tags: [dashboard]
      summary: All overdue bills
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Overdue bills
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                required: [bills, total]

  /dashboard/wallet-balances:
    get:
      operationId: getWalletBalances
      tags: [dashboard]
      summary: All wallet balances
      responses:
        "200":
          description: Wallet balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wallet"
                  totalBalance:
                    type: number
                required: [wallets, totalBalance]

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent transaction activity
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                required: [activities]

  # ─── USERS ───────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all treasury users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                required: [users]
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a specific user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user's details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deactivateUser
      tags: [users]
      summary: Deactivate a user (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /users/{id}/profile:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get user profile with wallets and bill stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ─── BILLS ───────────────────────────────────────────────────
  /bills:
    get:
      operationId: listBills
      tags: [bills]
      summary: List bills with optional filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, on_hold, partial, paid, overdue]
        - name: userId
          in: query
          schema:
            type: string
        - name: vendorId
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of bills
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                required: [bills, total]
    post:
      operationId: createBill
      tags: [bills]
      summary: Create a new bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillInput"
      responses:
        "201":
          description: Created bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}:
    get:
      operationId: getBill
      tags: [bills]
      summary: Get bill details with comments and audit trail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bill details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillDetail"
    patch:
      operationId: updateBill
      tags: [bills]
      summary: Update bill fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillInput"
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/approve:
    post:
      operationId: approveBill
      tags: [bills]
      summary: Approve a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                approvedAmount:
                  type: number
      responses:
        "200":
          description: Approved bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/reject:
    post:
      operationId: rejectBill
      tags: [bills]
      summary: Reject a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        "200":
          description: Rejected bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/hold:
    post:
      operationId: holdBill
      tags: [bills]
      summary: Put a bill on hold
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                rescheduleDate:
                  type: string
      responses:
        "200":
          description: Bill on hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/partial-approve:
    post:
      operationId: partialApproveBill
      tags: [bills]
      summary: Partially approve a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approvedAmount:
                  type: number
                comment:
                  type: string
              required: [approvedAmount]
      responses:
        "200":
          description: Partially approved bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/escalate:
    post:
      operationId: escalateBill
      tags: [bills]
      summary: Escalate an overdue bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        "200":
          description: Escalated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/comments:
    get:
      operationId: getBillComments
      tags: [comments]
      summary: Get comments for a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bill comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
                required: [comments]
    post:
      operationId: addBillComment
      tags: [comments]
      summary: Add a comment to a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                authorId:
                  type: string
              required: [text, authorId]
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /bills/{id}/audit:
    get:
      operationId: getBillAudit
      tags: [audit]
      summary: Get audit trail for a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit trail
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                required: [entries]

  # ─── VENDORS ─────────────────────────────────────────────────
  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List all vendors/beneficiaries
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: object
                properties:
                  vendors:
                    type: array
                    items:
                      $ref: "#/components/schemas/Vendor"
                required: [vendors]
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a new vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorInput"
      responses:
        "201":
          description: Created vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get vendor profile with running balance and history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vendor details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorDetail"

  /vendors/{id}/liabilities:
    get:
      operationId: getVendorLiabilities
      tags: [vendors]
      summary: Get vendor liabilities with aging
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vendor liabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiabilityAging"

  # ─── WALLETS ─────────────────────────────────────────────────
  /wallets:
    get:
      operationId: listWallets
      tags: [wallets]
      summary: List all wallets/accounts
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of wallets
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wallet"
                required: [wallets]
    post:
      operationId: createWallet
      tags: [wallets]
      summary: Create a new wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWalletInput"
      responses:
        "201":
          description: Created wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  /wallets/{id}:
    get:
      operationId: getWallet
      tags: [wallets]
      summary: Get wallet details and statement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wallet details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletDetail"
    patch:
      operationId: updateWallet
      tags: [wallets]
      summary: Update wallet balance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                balance:
                  type: number
                name:
                  type: string
      responses:
        "200":
          description: Updated wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  # ─── NOTIFICATIONS ───────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  unreadCount:
                    type: integer
                required: [notifications, unreadCount]

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
              required: [userId]
      responses:
        "200":
          description: All notifications marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]

  # ─── AUDIT TRAIL ─────────────────────────────────────────────
  /audit:
    get:
      operationId: listAuditTrail
      tags: [audit]
      summary: Full audit trail with filters
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: billId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit trail entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  total:
                    type: integer
                required: [entries, total]

  # ─── REPORTS ─────────────────────────────────────────────────
  /reports/outstanding-liabilities:
    get:
      operationId: getOutstandingLiabilities
      tags: [reports]
      summary: Outstanding liabilities with aging breakdown
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Outstanding liabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiabilitiesReport"

  /reports/pending-approvals:
    get:
      operationId: getPendingApprovals
      tags: [reports]
      summary: All bills pending MD approval
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                  count:
                    type: integer
                required: [bills, total, count]

  /reports/paid-today:
    get:
      operationId: getPaidToday
      tags: [reports]
      summary: Total paid today summary
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paid today
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                  count:
                    type: integer
                required: [bills, total, count]

  /reports/partial-payments:
    get:
      operationId: getPartialPayments
      tags: [reports]
      summary: All partial payment records
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Partial payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                required: [bills, total]

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [md, treasury, payment_assistant]
        email:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
        billStats:
          type: object
          properties:
            total:
              type: integer
            pending:
              type: integer
            approved:
              type: integer
            totalAmount:
              type: number
            paidAmount:
              type: number
            outstandingAmount:
              type: number
          required: [total, pending, approved, totalAmount, paidAmount, outstandingAmount]
      required: [id, name, role, isActive, createdAt]

    CreateUserInput:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [md, treasury, payment_assistant]
        email:
          type: string
        phone:
          type: string
        password:
          type: string
      required: [name, role, password]

    UpdateUserInput:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [md, treasury, payment_assistant]
        email:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        password:
          type: string

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            wallets:
              type: array
              items:
                $ref: "#/components/schemas/Wallet"
            billStats:
              type: object
              properties:
                total:
                  type: integer
                pending:
                  type: integer
                approved:
                  type: integer
                totalAmount:
                  type: number
                paidAmount:
                  type: number
                outstandingAmount:
                  type: number
              required: [total, pending, approved, totalAmount, paidAmount, outstandingAmount]
            recentBills:
              type: array
              items:
                $ref: "#/components/schemas/Bill"
          required: [wallets, billStats, recentBills]

    Bill:
      type: object
      properties:
        id:
          type: string
        vendorId:
          type: string
        vendorName:
          type: string
        description:
          type: string
        amount:
          type: number
        approvedAmount:
          type: number
        paidAmount:
          type: number
        outstandingBalance:
          type: number
        scheduledDate:
          type: string
        dueDate:
          type: string
        walletId:
          type: string
        walletName:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
        status:
          type: string
          enum: [pending, approved, rejected, on_hold, partial, paid, overdue]
        createdBy:
          type: string
        createdByName:
          type: string
        hasAttachment:
          type: boolean
        overdueDays:
          type: integer
        createdAt:
