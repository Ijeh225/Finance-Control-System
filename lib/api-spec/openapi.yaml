openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FinCommand Executive Treasury API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: bills
    description: Bills and payment management
  - name: vendors
    description: Vendor/beneficiary management
  - name: wallets
    description: Wallet/account management
  - name: notifications
    description: Notification management
  - name: comments
    description: Comment and activity management
  - name: dashboard
    description: Dashboard summary endpoints
  - name: reports
    description: Reports and exports
  - name: audit
    description: Audit trail

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── DASHBOARD ───────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: MD dashboard summary cards
      parameters:
        - name: userId
          in: query
          schema:
            type: string
          description: Filter by user ID (omit for all users)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/scheduled-today:
    get:
      operationId: getScheduledToday
      tags: [dashboard]
      summary: All payments scheduled for today
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [user, vendor, priority, dueDate]
      responses:
        "200":
          description: Today scheduled payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                required: [bills, total]

  /dashboard/scheduled-tomorrow:
    get:
      operationId: getScheduledTomorrow
      tags: [dashboard]
      summary: All payments scheduled for tomorrow
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tomorrow scheduled payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                required: [bills, total]

  /dashboard/overdue:
    get:
      operationId: getOverdueBills
      tags: [dashboard]
      summary: All overdue bills
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Overdue bills
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                required: [bills, total]

  /dashboard/wallet-balances:
    get:
      operationId: getWalletBalances
      tags: [dashboard]
      summary: All wallet balances
      responses:
        "200":
          description: Wallet balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wallet"
                  totalBalance:
                    type: number
                required: [wallets, totalBalance]

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent transaction activity
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                required: [activities]

  /dashboard/payment-history:
    get:
      operationId: getPaymentHistory
      tags: [dashboard]
      summary: All paid bills (payment history), newest first
      parameters:
        - name: userId
          in: query
          schema:
            type: string
          description: Filter by user ID (omit for all — MD only)
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                required: [bills, total]

  /dashboard/cashflow:
    get:
      operationId: getDashboardCashflow
      tags: [dashboard]
      summary: Daily paid totals for the last N days (cash-flow trend)
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
          description: Number of days to look back (max 90)
        - name: userId
          in: query
          schema:
            type: string
          description: Filter by user ID (MD only)
      responses:
        "200":
          description: Daily cash-flow data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        amount:
                          type: number
                      required: [date, amount]
                  days:
                    type: integer
                required: [data, days]

  # ─── AUTH ────────────────────────────────────────────────────
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [users]
      summary: Change own password (any authenticated user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
              required: [currentPassword, newPassword]
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        "400":
          description: Wrong current password, too short, or same as current

  /auth/me:
    patch:
      operationId: updateMyProfile
      tags: [users]
      summary: Update own name, email, and phone (any authenticated user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileBasic"
        "400":
          description: Validation error
        "409":
          description: Email already in use

  # ─── USERS ───────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all treasury users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                required: [users]
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a specific user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user's details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deactivateUser
      tags: [users]
      summary: Deactivate a user (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /users/{id}/permanent:
    delete:
      operationId: permanentDeleteUser
      tags: [users]
      summary: Permanently delete a user (no bills allowed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        "409":
          description: User has existing bills

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset another user's password (MD only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required: [password]
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /users/{id}/profile:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get user profile with wallets and bill stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ─── BILLS ───────────────────────────────────────────────────
  /bills:
    get:
      operationId: listBills
      tags: [bills]
      summary: List bills with optional filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, on_hold, partial, paid, overdue, withdrawn]
        - name: userId
          in: query
          schema:
            type: string
        - name: vendorId
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of bills
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                required: [bills, total]
    post:
      operationId: createBill
      tags: [bills]
      summary: Create a new bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillInput"
      responses:
        "201":
          description: Created bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}:
    get:
      operationId: getBill
      tags: [bills]
      summary: Get bill details with comments and audit trail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bill details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillDetail"
    patch:
      operationId: updateBill
      tags: [bills]
      summary: Update bill fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillInput"
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
    delete:
      operationId: deleteBill
      tags: [bills]
      summary: Permanently delete a bill (MD only). Reverses vendor totals.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bill deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /bills/{id}/approve:
    post:
      operationId: approveBill
      tags: [bills]
      summary: Approve a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                approvedAmount:
                  type: number
      responses:
        "200":
          description: Approved bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/reject:
    post:
      operationId: rejectBill
      tags: [bills]
      summary: Reject a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        "200":
          description: Rejected bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/hold:
    post:
      operationId: holdBill
      tags: [bills]
      summary: Put a bill on hold
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                rescheduleDate:
                  type: string
      responses:
        "200":
          description: Bill on hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/partial-approve:
    post:
      operationId: partialApproveBill
      tags: [bills]
      summary: Partially approve a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approvedAmount:
                  type: number
                comment:
                  type: string
              required: [approvedAmount]
      responses:
        "200":
          description: Partially approved bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/escalate:
    post:
      operationId: escalateBill
      tags: [bills]
      summary: Escalate an overdue bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        "200":
          description: Escalated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/withdraw:
    post:
      operationId: withdrawBill
      tags: [bills]
      summary: Withdraw a pending bill (creator only) — soft-deletes for audit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bill soft-deleted and returned with withdrawn status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/pay:
    post:
      operationId: processBillPayment
      tags: [bills]
      summary: Process payment for an approved or partial bill (Payment Assistant)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessPaymentInput"
      responses:
        "200":
          description: Bill marked paid and transaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          description: Validation error or insufficient wallet balance
        "403":
          description: Not authorized to process payment
        "404":
          description: Bill or wallet not found

  /bills/{id}/reschedule:
    post:
      operationId: rescheduleBill
      tags: [bills]
      summary: Reschedule a partial or approved bill to a new scheduled date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduledDate:
                  type: string
                  description: New scheduled date in YYYY-MM-DD format
              required: [scheduledDate]
      responses:
        "200":
          description: Bill rescheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          description: Validation error or invalid status
        "403":
          description: Forbidden
        "404":
          description: Bill not found

  # ─── ATTACHMENTS ──────────────────────────────────────────────
  /bills/{id}/attachments/request-upload:
    post:
      operationId: requestBillAttachmentUpload
      tags: [bills]
      summary: Request a presigned URL to upload a file attachment for a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAttachmentUploadInput"
      responses:
        "200":
          description: Presigned upload URL and attachment ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAttachmentUploadResponse"

  /bills/{id}/attachments/{attachmentId}/confirm:
    post:
      operationId: confirmBillAttachment
      tags: [bills]
      summary: Confirm that the file was successfully uploaded to storage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /bills/{id}/attachments:
    post:
      operationId: uploadBillAttachment
      tags: [bills]
      summary: Upload a file attachment for a bill (multipart/form-data)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: The file to upload (binary)
              required: [file]
      responses:
        "201":
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillAttachment"
    get:
      operationId: listBillAttachments
      tags: [bills]
      summary: List confirmed attachments for a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attachment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items:
                      $ref: "#/components/schemas/BillAttachment"
                required: [attachments]

  /attachments/{attachmentId}:
    delete:
      operationId: deleteBillAttachment
      tags: [bills]
      summary: Delete a bill attachment
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /attachments/{attachmentId}/download:
    get:
      operationId: downloadBillAttachment
      tags: [bills]
      summary: Download a bill attachment file
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /bills/{id}/payments:
    get:
      operationId: getBillPayments
      tags: [bills]
      summary: Get individual payment events for a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      $ref: "#/components/schemas/BillPayment"
                required: [payments]

  /bills/{id}/comments:
    get:
      operationId: getBillComments
      tags: [comments]
      summary: Get comments for a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bill comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
                required: [comments]
    post:
      operationId: addBillComment
      tags: [comments]
      summary: Add a comment to a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                authorId:
                  type: string
              required: [text, authorId]
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /bills/{id}/audit:
    get:
      operationId: getBillAudit
      tags: [audit]
      summary: Get audit trail for a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audit trail
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                required: [entries]

  # ─── VENDORS ─────────────────────────────────────────────────
  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List all vendors/beneficiaries
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: object
                properties:
                  vendors:
                    type: array
                    items:
                      $ref: "#/components/schemas/Vendor"
                required: [vendors]
    post:
      operationId: createVendor
      tags: [vendors]
      summary: Create a new vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorInput"
      responses:
        "201":
          description: Created vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get vendor profile with running balance and history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vendor details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorDetail"
    patch:
      operationId: updateVendor
      tags: [vendors]
      summary: Update vendor details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVendorInput"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
    delete:
      operationId: deleteVendor
      tags: [vendors]
      summary: Delete a vendor (MD only). Blocked if active bills exist.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vendor deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /vendors/{id}/spending:
    get:
      operationId: getVendorSpending
      tags: [vendors]
      summary: Get per-vendor payment spending summary with monthly breakdown
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vendor spending summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  vendorId:
                    type: string
                  vendorName:
                    type: string
                  totalPaid:
                    type: number
                  months:
                    type: array
                    items:
                      type: object
                      properties:
                        month:
                          type: string
                          description: "YYYY-MM format"
                        amount:
                          type: number
                      required: [month, amount]
                required: [vendorId, vendorName, totalPaid, months]

  /vendors/{id}/liabilities:
    get:
      operationId: getVendorLiabilities
      tags: [vendors]
      summary: Get vendor liabilities with aging
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vendor liabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiabilityAging"

  # ─── WALLETS ─────────────────────────────────────────────────
  /wallets:
    get:
      operationId: listWallets
      tags: [wallets]
      summary: List all wallets/accounts
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of wallets
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wallet"
                required: [wallets]
    post:
      operationId: createWallet
      tags: [wallets]
      summary: Create a new wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWalletInput"
      responses:
        "201":
          description: Created wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  /wallets/{id}:
    get:
      operationId: getWallet
      tags: [wallets]
      summary: Get wallet details and statement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wallet details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletDetail"
    patch:
      operationId: updateWallet
      tags: [wallets]
      summary: Update wallet balance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                balance:
                  type: number
                name:
                  type: string
                narration:
                  type: string
                  description: Optional custom narration for the ledger entry when balance changes
      responses:
        "200":
          description: Updated wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  /wallets/transfer:
    post:
      operationId: transferFunds
      tags: [wallets]
      summary: Transfer funds between wallets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "200":
          description: Transfer result with updated wallet balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    $ref: "#/components/schemas/Wallet"
                  to:
                    $ref: "#/components/schemas/Wallet"
                  debitTx:
                    $ref: "#/components/schemas/WalletTransaction"
                  creditTx:
                    $ref: "#/components/schemas/WalletTransaction"
                required: [from, to, debitTx, creditTx]

  /wallets/{id}/statement:
    get:
      operationId: getWalletStatement
      tags: [wallets]
      summary: Get wallet transaction statement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
        - name: type
          in: query
          schema:
            type: string
            enum: [credit, debit, transfer_in, transfer_out, bill_payment]
        - name: from
          in: query
          schema:
            type: string
            description: ISO date string (inclusive)
        - name: to
          in: query
          schema:
            type: string
            description: ISO date string (inclusive)
        - name: search
          in: query
          schema:
            type: string
            description: Search narration text
      responses:
        "200":
          description: Wallet statement with transaction history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletStatement"

  # ─── NOTIFICATIONS ───────────────────────────────────────────
  /notifications/stream:
    get:
      operationId: streamNotifications
      tags: [notifications]
      summary: SSE stream for real-time notification delivery
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  unreadCount:
                    type: integer
                required: [notifications, unreadCount]

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/{id}:
    delete:
      operationId: deleteNotification
      tags: [notifications]
      summary: Delete a notification (owner or MD)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notification deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        "403":
          description: Forbidden
        "404":
          description: Not found

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
              required: [userId]
      responses:
        "200":
          description: All notifications marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                required: [updated]

  # ─── AUDIT TRAIL ─────────────────────────────────────────────
  /audit:
    get:
      operationId: listAuditTrail
      tags: [audit]
      summary: Full audit trail with filters
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: billId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit trail entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  total:
                    type: integer
                required: [entries, total]

  # ─── REPORTS ─────────────────────────────────────────────────
  /reports/outstanding-liabilities:
    get:
      operationId: getOutstandingLiabilities
      tags: [reports]
      summary: Outstanding liabilities with aging breakdown
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Filter bills with dueDate >= this date (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Filter bills with dueDate <= this date (YYYY-MM-DD)
      responses:
        "200":
          description: Outstanding liabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiabilitiesReport"

  /reports/pending-approvals:
    get:
      operationId: getPendingApprovals
      tags: [reports]
      summary: All bills pending MD approval
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Filter bills with dueDate >= this date (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Filter bills with dueDate <= this date (YYYY-MM-DD)
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                  count:
                    type: integer
                required: [bills, total, count]

  /reports/paid-today:
    get:
      operationId: getPaidToday
      tags: [reports]
      summary: Total paid today summary
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Filter paid bills with updatedAt >= this date (YYYY-MM-DD); defaults to today
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Filter paid bills with updatedAt <= this date (YYYY-MM-DD); defaults to today
      responses:
        "200":
          description: Paid today
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                  count:
                    type: integer
                required: [bills, total, count]

  /reports/partial-payments:
    get:
      operationId: getPartialPayments
      tags: [reports]
      summary: All partial payment records
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Filter bills with dueDate >= this date (YYYY-MM-DD)
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Filter bills with dueDate <= this date (YYYY-MM-DD)
      responses:
        "200":
          description: Partial payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  bills:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bill"
                  total:
                    type: number
                required: [bills, total]

  /export/reports/{type}:
    get:
      operationId: exportReport
      tags: [reports]
      summary: Export a report as Excel or PDF
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [outstanding-liabilities, pending-approvals, paid-today, partial-payments]
        - name: format
          in: query
          schema:
            type: string
            enum: [excel, pdf]
            default: excel
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Report file (Excel or PDF)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary

  /export/vendors/{id}/statement:
    get:
      operationId: exportVendorStatement
      tags: [vendors]
      summary: Export a vendor payment statement as Excel or PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [excel, pdf]
            default: excel
      responses:
        "200":
          description: Vendor statement file (Excel or PDF)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary

  /export/wallets/{id}/statement:
    get:
      operationId: exportWalletStatement
      tags: [wallets]
      summary: Export a wallet transaction statement as Excel or PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [excel, pdf]
            default: excel
      responses:
        "200":
          description: Wallet statement file (Excel or PDF)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [md, treasury, payment_assistant]
        email:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
        billStats:
          type: object
          properties:
            total:
              type: integer
            pending:
              type: integer
            approved:
              type: integer
            totalAmount:
              type: number
            paidAmount:
              type: number
            outstandingAmount:
              type: number
          required: [total, pending, approved, totalAmount, paidAmount, outstandingAmount]
      required: [id, name, role, isActive, createdAt]

    UpdateProfileInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string

    UserProfileBasic:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [md, treasury, payment_assistant]
      required: [id, name, role]

    CreateUserInput:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [md, treasury, payment_assistant]
        email:
          type: string
        phone:
          type: string
        password:
          type: string
      required: [name, role, password]

    UpdateUserInput:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [md, treasury, payment_assistant]
        email:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        password:
          type: string

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            wallets:
              type: array
              items:
                $ref: "#/components/schemas/Wallet"
            billStats:
              type: object
              properties:
                total:
                  type: integer
                pending:
                  type: integer
                approved:
                  type: integer
                totalAmount:
                  type: number
                paidAmount:
                  type: number
                outstandingAmount:
                  type: number
              required: [total, pending, approved, totalAmount, paidAmount, outstandingAmount]
            recentBills:
              type: array
              items:
                $ref: "#/components/schemas/Bill"
          required: [wallets, billStats, recentBills]

    Bill:
      type: object
      properties:
        id:
          type: string
        vendorId:
          type: string
        vendorName:
          type: string
        description:
          type: string
        amount:
          type: number
        approvedAmount:
          type: number
        paidAmount:
          type: number
        outstandingBalance:
          type: number
        scheduledDate:
          type: string
        dueDate:
          type: string
        walletId:
          type: string
        walletName:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
        status:
          type: string
          enum: [pending, approved, rejected, on_hold, partial, paid, overdue, withdrawn]
        withdrawnAt:
          type: string
          nullable: true
        withdrawnBy:
          type: string
          nullable: true
        withdrawnByName:
          type: string
          nullable: true
        createdBy:
          type: string
        createdByName:
          type: string
        hasAttachment:
          type: boolean
        overdueDays:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        paidBy:
          type: string
        paidByName:
          type: string
        paidAt:
          type: string
        paymentReference:
          type: string
        paidWalletId:
          type: string
        paidWalletName:
          type: string
        notes:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
      required:
        - id
        - vendorId
        - vendorName
        - description
        - amount
        - paidAmount
        - outstandingBalance
        - scheduledDate
        - priority
        - status
        - createdBy
        - createdByName
        - createdAt

    BillDetail:
      allOf:
        - $ref: "#/components/schemas/Bill"
        - type: object
          properties:
            comments:
              type: array
              items:
                $ref: "#/components/schemas/Comment"
            auditTrail:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"
            vendor:
              $ref: "#/components/schemas/Vendor"
          required: [comments, auditTrail]

    CreateBillInput:
      type: object
      properties:
        vendorId:
          type: string
        description:
          type: string
        amount:
          type: number
        scheduledDate:
          type: string
        dueDate:
          type: string
        walletId:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
        createdBy:
          type: string
        hasAttachment:
          type: boolean
        notes:
          type: string
        link:
          type: string
      required: [vendorId, description, amount, scheduledDate, priority, createdBy]

    UpdateBillInput:
      type: object
      properties:
        vendorId:
          type: string
        description:
          type: string
        amount:
          type: number
        scheduledDate:
          type: string
        dueDate:
          type: string
        walletId:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
        notes:
          type: string
        link:
          type: string

    ProcessPaymentInput:
      type: object
      properties:
        walletId:
          type: string
        amount:
          type: number
        paymentReference:
          type: string
        narration:
          type: string
      required: [walletId, amount]

    Vendor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        totalBilled:
          type: number
        totalPaid:
          type: number
        outstandingBalance:
          type: number
        lastPaymentDate:
          type: string
        containers:
          type: string
          nullable: true
        requestPurpose:
          type: string
          nullable: true
        relatedLink:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, name, totalBilled, totalPaid, outstandingBalance, createdAt]

    VendorDetail:
      allOf:
        - $ref: "#/components/schemas/Vendor"
        - type: object
          properties:
            bills:
              type: array
              items:
                $ref: "#/components/schemas/Bill"
            recentActivity:
              type: array
              items:
                $ref: "#/components/schemas/AuditEntry"
          required: [bills, recentActivity]

    CreateVendorInput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        containers:
          type: string
        requestPurpose:
          type: string
        relatedLink:
          type: string
      required: [name]

    UpdateVendorInput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        containers:
          type: string
        requestPurpose:
          type: string
        relatedLink:
          type: string

    BillPayment:
      type: object
      properties:
        id:
          type: string
        walletId:
          type: string
        amount:
          type: number
        balanceBefore:
          type: number
        balanceAfter:
          type: number
        narration:
          type: string
        initiatedBy:
          type: string
        initiatedByName:
          type: string
        relatedBillId:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, walletId, amount, balanceBefore, balanceAfter, narration, initiatedBy, initiatedByName, createdAt]

    LiabilityAging:
      type: object
      properties:
        vendorId:
          type: string
        vendorName:
          type: string
        totalOutstanding:
          type: number
        aging0to7:
          type: number
        aging8to14:
          type: number
        aging15to30:
          type: number
        aging30plus:
          type: number
      required: [vendorId, vendorName, totalOutstanding, aging0to7, aging8to14, aging15to30, aging30plus]

    Wallet:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        balance:
          type: number
        currency:
          type: string
        isLow:
          type: boolean
        lowBalanceThreshold:
          type: number
          nullable: true
        ownedBy:
          type: string
        ownedByName:
          type: string
        createdAt:
          type: string
      required: [id, name, balance, currency, createdAt]

    WalletTransaction:
      type: object
      properties:
        id:
          type: string
        walletId:
          type: string
        type:
          type: string
          enum: [credit, debit, transfer_in, transfer_out, bill_payment]
        amount:
          type: number
        balanceBefore:
          type: number
        balanceAfter:
          type: number
        narration:
          type: string
        initiatedBy:
          type: string
        initiatedByName:
          type: string
        relatedWalletId:
          type: string
          nullable: true
        relatedWalletName:
          type: string
          nullable: true
        relatedBillId:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, walletId, type, amount, balanceBefore, balanceAfter, narration, initiatedBy, initiatedByName, createdAt]

    WalletDetail:
      allOf:
        - $ref: "#/components/schemas/Wallet"
        - type: object
          properties:
            recentTransactions:
              type: array
              items:
                $ref: "#/components/schemas/WalletTransaction"
          required: [recentTransactions]

    WalletStatement:
      type: object
      properties:
        wallet:
          $ref: "#/components/schemas/Wallet"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/WalletTransaction"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required: [wallet, transactions, total, page, pageSize]

    TransferInput:
      type: object
      properties:
        fromWalletId:
          type: string
        toWalletId:
          type: string
        amount:
          type: number
        narration:
          type: string
      required: [fromWalletId, toWalletId, amount, narration]

    CreateWalletInput:
      type: object
      properties:
        name:
          type: string
        bankName:
          type: string
        accountNumber:
          type: string
        balance:
          type: number
        currency:
          type: string
        ownedBy:
          type: string
        lowBalanceThreshold:
          type: number
          nullable: true
      required: [name, balance, currency]

    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum:
            - bill_approved
            - bill_rejected
            - bill_partial
            - bill_held
            - comment_added
            - wallet_low
            - overdue_warning
            - duplicate_detected
            - escalated
            - attachment_uploaded
        title:
          type: string
        body:
          type: string
        billId:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
      required: [id, userId, type, title, body, isRead, createdAt]

    Comment:
      type: object
      properties:
        id:
          type: string
        billId:
          type: string
        authorId:
          type: string
        authorName:
          type: string
        authorRole:
          type: string
        text:
          type: string
        createdAt:
          type: string
      required: [id, billId, authorId, authorName, authorRole, text, createdAt]

    AuditEntry:
      type: object
      properties:
        id:
          type: string
        billId:
          type: string
        billDescription:
          type: string
        userId:
          type: string
        userName:
          type: string
        action:
          type: string
        details:
          type: string
        oldValue:
          type: string
        newValue:
          type: string
        createdAt:
          type: string
      required: [id, userId, userName, action, createdAt]

    DashboardSummary:
      type: object
      properties:
        scheduledTodayCount:
          type: integer
        scheduledTodayAmount:
          type: number
        scheduledTomorrowCount:
          type: integer
        scheduledTomorrowAmount:
          type: number
        pendingApprovalCount:
          type: integer
        pendingApprovalAmount:
          type: number
        approvedUnpaidCount:
          type: integer
        approvedUnpaidAmount:
          type: number
        totalOutstandingLiabilities:
          type: number
        overdueCount:
          type: integer
        overdueAmount:
          type: number
        totalWalletBalance:
          type: number
        paidTodayCount:
          type: integer
        paidTodayAmount:
          type: number
        paidAllTimeCount:
          type: integer
        paidAllTimeAmount:
          type: number
        partialPaymentsCount:
          type: integer
        partialPaymentsAmount:
          type: number
        unreadNotificationsCount:
          type: integer
      required:
        - scheduledTodayCount
        - scheduledTodayAmount
        - scheduledTomorrowCount
        - scheduledTomorrowAmount
        - pendingApprovalCount
        - pendingApprovalAmount
        - approvedUnpaidCount
        - approvedUnpaidAmount
        - totalOutstandingLiabilities
        - overdueCount
        - overdueAmount
        - totalWalletBalance
        - paidTodayCount
        - paidTodayAmount
        - paidAllTimeCount
        - paidAllTimeAmount
        - partialPaymentsCount
        - partialPaymentsAmount
        - unreadNotificationsCount

    BillAttachment:
      type: object
      properties:
        id:
          type: string
        billId:
          type: string
        fileName:
          type: string
        fileSize:
          type: integer
        mimeType:
          type: string
        uploadedBy:
          type: string
        uploadedByName:
          type: string
        uploadedAt:
          type: string
      required: [id, billId, fileName, uploadedBy, uploadedByName, uploadedAt]

    RequestAttachmentUploadInput:
      type: object
      properties:
        fileName:
          type: string
        fileSize:
          type: integer
        mimeType:
          type: string
      required: [fileName]

    RequestAttachmentUploadResponse:
      type: object
      properties:
        attachmentId:
          type: string
        uploadUrl:
          type: string
        objectPath:
          type: string
      required: [attachmentId, uploadUrl, objectPath]

    LiabilitiesReport:
      type: object
      properties:
        totalOutstanding:
          type: number
        aging0to7:
          type: number
        aging8to14:
          type: number
        aging15to30:
          type: number
        aging30plus:
          type: number
        byVendor:
          type: array
          items:
            $ref: "#/components/schemas/LiabilityAging"
        byUser:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              userName:
                type: string
              total:
                type: number
            required: [userId, userName, total]
        bills:
          type: array
          items:
            $ref: "#/components/schemas/Bill"
      required: [totalOutstanding, aging0to7, aging8to14, aging15to30, aging30plus, byVendor, byUser, bills]
